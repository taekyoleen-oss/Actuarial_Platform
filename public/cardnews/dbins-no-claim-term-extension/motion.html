<title>DB손해보험 건강할수록 든든 종합보험 — 배타적사용권 분석</title>
<!--
  tkLeen deck template v1.12.2
  편집 규칙: <script id="deck-data"> 안의 JSON만 바꾼다. 나머지(스타일·엔진)는 고정한다.
  JSON을 넣을 때 "</" 는 "<\/" 로 바꾸어 적는다.
  모션 단계: deck-data.motion.level = "none" | "basic"(기본값) | "rich"
  개별 효과: motion.stagger("off"|"blocks"|"items") · ring · zoom · grow (true|false)
  수식: math 블록, 글 안의 <math>…</math> (MathML)
  개별 모션: 블록·항목의 fx, order, reveal / 쪽의 motion(enter, speed, stagger, ring, zoom, grow)
  모션 시간: motion.speed = "slow"|"normal"|"fast" 또는 배율 숫자 0.5–3 (덱 전체·쪽, v1.6.1)
  자유 배치: 쪽 free:true + 블록 box{x,y,w,h}(%) · 배율: 블록 scale(0.6–1.6)
  스타일: theme.style = "tkleen"(기본값) | "klein"(참조 파일 motion-template.html의 스타일) · 발표 중 T 키로 미리 보기
  v1.6 블록: stack(누적 막대) · grid(100칸 격자) · sim(레버 계산기) / 양식: 쪽 footnote · row.panel · 항목 noteRows
  v1.6 이동: go + goRef(도착 쪽에서 강조할 ref) · goView(도착 쪽 보기 번호) · 숫자 키 + Enter 쪽 이동
  v1.7 글자 크기: theme.type = {역할: px} (title·kicker·lead·heading·body·sub·table·tableHead·callout·caption·math·footnote)
       맞춤: theme.fit = "auto"(기본값, 쪽마다 0.77–1.2배 자동 맞춤) | "fixed"(키우기·줄이기 없음, 넘치면 보고)
  v1.8 배치: theme.align = "center"(기본값) | "top"(본문을 위에 붙이고 번호 섹션 사이를 theme.sectionGap(기본 40px)까지 넓힘)
       글머리 점 없애기: list·section의 bullet: false,
       ①·②처럼 동그라미 번호로 시작하는 항목은 점을 그리지 않음
       한 단계씩: steps = "list"(첫 글머리 묶음의 항목을 차례로)
  v1.9 머리글: 제목 아래 구분선과 본문 위 여백(기본 켜짐) · theme.titleRule: false로 끔 · theme.bodyGap(구분선과 본문 사이 px, 기본 24)
  v1.10 블록: timeline(시간선 · 시점 눈금, 행마다 금액, 방향 화살표, 나란한 패널) · 덱의 글자 크기 표를 따름
  v1.10.1 시간선 정렬: 눈금·금액·안내선·화살표가 같은 가로 기준(px)을 씀 · 점검 __deck.timelines()
  v1.11 조작: 다음 쪽은 Space·Enter·→·PageDown, 이전 쪽은 ←·PageUp·Backspace. 마우스 왼쪽 단추는 항목 고르기·추가 설명·링크 등
       쪽 안의 기능에만 쓰고 쪽을 넘기지 않음(1.8.0의 ‘누르면 다음 쪽’과 meta.clickNext를 없앰)
  v1.12 이어지는 주제: 쪽의 topic(한 상품·주제의 설명이 여러 쪽에 이어질 때). 같은 topic이 이어지는 쪽을 세어
       머리글 오른쪽 위에 ‘주제 이름 │ n/N’으로 표시 · 글자 크기 theme.type.topic(기본은 kicker와 같음) · 점검 __deck.topics()
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=JetBrains+Mono:wght@400;700&display=swap">
<style id="deck-style">
/*__FONTS__*/
:root{
  --ink:#0A0A0A;--sky:#4A90C2;--navy:#1B2845;--cream:#FAFAF7;
  --sky-50:#EEF5FB;--sky-100:#DCEAF5;--sky-200:#BCD6EA;
  --line:#DCE1E8;--muted:#4F596B;--soft:#8A93A3;
  --amber:#A86A12;--amber-50:#FBF3E4;--amber-200:#E9CF9E;--gray-50:#F1F3F7;
  --f-body:'Pretendard Variable','Pretendard','Noto Sans KR','Noto Sans CJK KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  --f-disp:'Fraunces','Pretendard Variable','Pretendard',Georgia,serif;
  --f-mono:'JetBrains Mono','Pretendard Variable','Pretendard',ui-monospace,monospace;
  --ez:cubic-bezier(.22,.68,.18,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#E7EAEE}
body{font-family:var(--f-body);color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
.viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{width:1280px;height:720px;position:relative;flex:none;box-shadow:0 10px 40px rgba(27,40,69,.18);transition:background .3s}

/* ---------- 슬라이드 틀 ---------- */
.slide{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;padding:44px 62px 66px;overflow:hidden;opacity:0;visibility:hidden;pointer-events:none}
.slide.active{opacity:1;visibility:visible;pointer-events:auto}
body:not([data-motion="none"]) .slide{transition:opacity calc(.3s*var(--mk,1)),transform calc(.55s*var(--mk,1)) var(--ez),visibility 0s calc(.3s*var(--mk,1))}
body:not([data-motion="none"]) .slide.active{transition:opacity calc(.3s*var(--mk,1)),transform calc(.55s*var(--mk,1)) var(--ez)}
.slide::before{content:'';position:absolute;left:62px;top:0;width:56px;height:5px;background:var(--sky)}
.slide.cover,.slide.divider{display:block;padding:0;background:var(--navy);color:var(--cream)}
.slide.cover::before,.slide.divider::before,.slide.page::before{display:none}
.slide.page{padding:0;background:#F1F3F7}

.hd{flex:none;margin-bottom:14px}
.kicker{font-family:var(--f-mono);font-size:var(--t-kicker,13px);letter-spacing:.04em;color:var(--sky);display:flex;gap:12px;align-items:center;margin-bottom:8px;min-height:26px}
.kicker .no{color:var(--navy);font-weight:700}
.kicker .bar{width:18px;height:1px;background:var(--sky-200)}
.kicker .ph{margin-left:auto;font-family:var(--f-body);font-size:12.5px;padding:4px 11px;border-radius:999px;border:1px solid var(--sky-200);color:var(--navy);background:#fff;letter-spacing:0}
/* v1.12.0 이어지는 주제(topic): 한 주제가 여러 쪽에 이어질 때 머리글 오른쪽 위에 표시 */
/* v1.12.2 표의 추가 설명 표시(‘+’)를 첫 칸 글 뒤에 붙임: 설명이 없는 행과 글 시작 위치가 같음 */
/* v1.12.1 추가 설명 창 제목: 숫자로 시작하는 글을 자르지 않음, 숫자 카드는 ‘값단위 · 설명’, 막대는 ‘이름 · 값’ */
.kicker .topic{margin-left:auto;display:inline-flex;align-items:center;gap:8px;max-width:58%;min-width:0;font-family:var(--f-body);font-size:var(--t-topic,var(--t-kicker,13px));line-height:1.35;font-weight:600;letter-spacing:0;color:var(--navy);background:var(--sky-50);border:1px solid var(--sky-200);border-left:3px solid var(--sky);border-radius:4px;padding:1px 10px 1px 9px;white-space:nowrap}
.kicker .topic .tp-t{overflow:hidden;text-overflow:ellipsis;min-width:0}
.kicker .topic .tp-n{flex:none;font-family:var(--f-mono);font-weight:700;color:var(--sky);padding-left:8px;border-left:1px solid var(--sky-200)}
.kicker .ph+.topic{margin-left:10px}
h2{font-size:var(--t-title,32px);line-height:1.3;font-weight:700;color:var(--navy);margin:0;letter-spacing:-.015em}
.lead{font-size:var(--t-lead,19px);line-height:1.55;color:var(--muted);margin:8px 0 0}
.bd{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}
.bdi{display:flex;flex-direction:column;gap:16px}
body[data-align="top"] .bd{justify-content:flex-start}
body[data-align="top"] .b-row{align-items:start}
body[data-align="top"] .sg{margin-top:var(--sg,0px)}
.b-list.nb>li,.b-list li.cn{padding-left:0}
.b-list.nb>li::before,.b-list li.cn::before{display:none}

.ft{position:absolute;left:62px;right:62px;bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--f-mono);font-size:12px;color:var(--soft);border-top:1px solid var(--line);padding-top:8px}
.ft>span:first-child{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ft .r{display:flex;gap:14px;align-items:center}
.slide.page .ft{left:20px;right:20px;bottom:10px;border-top:0}
.slide.page .ft>span:first-child,.slide.page .ft .wm{visibility:hidden}
.wm{font-family:var(--f-disp);font-weight:300;font-size:15px;color:var(--navy);letter-spacing:.01em}
.wm b{color:var(--sky);font-weight:400}
.ftnav{display:flex;gap:6px;align-items:center}
.pv{all:unset;cursor:pointer;font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--navy);border:1px solid var(--line);background:#fff;padding:2px 9px;border-radius:5px;white-space:nowrap;line-height:1.35}
.pv:hover{border-color:var(--sky);color:var(--sky)}
.pv.bk{display:none;border-color:var(--amber-200);color:#7A4B07;background:var(--amber-50)}
.canback .pv.bk{display:inline-block}

/* ---------- 표지·구분 ---------- */
.gridbg{position:absolute;inset:0;background-image:linear-gradient(rgba(250,250,247,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(250,250,247,.045) 1px,transparent 1px);background-size:40px 40px}
.cover .in{position:absolute;left:84px;top:96px;right:120px}
.cover .kk,.divider .kk{font-family:var(--f-mono);font-size:14px;letter-spacing:.12em;color:var(--sky);margin-bottom:24px}
.cover h1{font-size:50px;line-height:1.22;font-weight:700;margin:0;letter-spacing:-.02em;color:#fff;max-width:900px}
.cover .sub{font-size:22px;line-height:1.6;color:#C9D3E3;margin:22px 0 0;max-width:900px}
.cover .line{width:72px;height:4px;background:var(--sky);margin:30px 0 22px}
.cover .meta{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:17.5px;color:#C9D3E3;margin:0}
.cover .meta dt{font-family:var(--f-mono);font-size:13px;color:var(--sky);padding-top:3px}
.cover .meta dd{margin:0}
.cover .cft{position:absolute;left:84px;right:84px;bottom:34px;display:flex;justify-content:space-between;align-items:flex-end;font-size:13.5px;color:#8F9BB2}
.cover .wm,.divider .wm{color:var(--cream);font-size:24px}
.divider .in{position:absolute;left:96px;top:190px;right:96px}
.divider h1{font-size:48px;line-height:1.25;margin:0;color:#fff;font-weight:700;letter-spacing:-.02em;max-width:900px}
.divider p{font-size:21px;line-height:1.6;color:#C9D3E3;margin:22px 0 0;max-width:900px}
.divider .num{font-family:var(--f-disp);font-size:120px;font-weight:300;color:rgba(74,144,194,.35);position:absolute;right:96px;top:150px;line-height:1}

/* ---------- 블록 ---------- */
.b-text{font-size:var(--t-body,19px);line-height:1.6;color:#232830;margin:0}
.b-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.b-list>li{position:relative;padding-left:24px;font-size:var(--t-body,20px);line-height:1.5;color:#232830}
.b-list>li::before{content:'';position:absolute;left:4px;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--sky)}
.b-list.num{counter-reset:n}
.b-list.num>li{padding-left:42px;counter-increment:n}
.b-list.num>li::before{content:counter(n);left:0;top:.05em;width:28px;height:28px;border-radius:7px;background:var(--navy);color:#fff;font:600 15px/28px var(--f-disp);text-align:center}
.b-list ul{margin:5px 0 0;padding:0;list-style:none}
.b-list ul li{position:relative;padding-left:18px;font-size:var(--t-sub,17px);color:var(--muted);margin-top:3px}
.b-list ul li::before{content:'–';position:absolute;left:2px;color:var(--soft)}
.b-cards{display:grid;gap:16px}
.b-cards.c1{grid-template-columns:1fr}.b-cards.c2{grid-template-columns:repeat(2,1fr)}.b-cards.c3{grid-template-columns:repeat(3,1fr)}.b-cards.c4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.card h3{font-size:var(--t-heading,21px);line-height:1.3;margin:0;color:var(--navy)}
.card p{font-size:var(--t-body,17px);line-height:1.55;margin:0;color:#232830}
.card.sky{background:var(--sky-50);border-color:var(--sky-100)}
.card.navy{background:var(--navy);border-color:var(--navy)}.card.navy h3{color:#fff}.card.navy p{color:#D7DEEA}
.card.amber{background:var(--amber-50);border-color:var(--amber-200)}
.card.white{background:#fff}
.tag{align-self:flex-start;font-size:13px;font-weight:600;line-height:1;padding:6px 10px;border-radius:999px;border:1px solid var(--sky);color:var(--sky);background:#fff;white-space:nowrap}
.card.amber .tag{border-color:var(--amber);color:var(--amber)}
.card .go{margin-top:auto}
.b-table{width:100%;border-collapse:collapse;font-size:var(--t-table,17px)}
.b-table th{background:var(--navy);color:#fff;font-weight:600;text-align:center;padding:10px 12px;font-size:var(--t-tableHead,15.5px)}
.b-table td{border-bottom:1px solid var(--line);padding:10px 13px;line-height:1.45;color:#232830;vertical-align:middle}
.b-table tbody tr:nth-child(even) td{background:#F7F9FB}
.b-table td.k{font-weight:700;color:var(--navy)}
.b-table td.c{text-align:center}
.b-table td.n{text-align:right;font-variant-numeric:tabular-nums}
.b-table tr.hl td{background:var(--sky-50)!important}
.b-flow{display:grid;grid-template-columns:repeat(var(--n),1fr);column-gap:38px;row-gap:26px}
.step{position:relative;border:1.5px solid var(--sky-200);background:var(--sky-50);border-radius:12px;padding:14px 16px;min-height:118px}
.step .sh{display:flex;align-items:center;gap:8px}
.step .sn{font-family:var(--f-disp);font-size:26px;font-weight:600;color:var(--sky);line-height:1}
.step .who{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--navy);color:#fff}
.step h4{margin:8px 0 4px;font-size:var(--t-heading,19px);line-height:1.35;color:var(--navy)}
.step p{margin:0;font-size:var(--t-body,16px);line-height:1.5;color:#333B48}
.step .arr{position:absolute;right:-30px;top:calc(50% - 13px);font-style:normal;color:var(--sky);font:700 24px/1 var(--f-body)}
.b-stats{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:16px}
.stat{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.stat .v{font-family:var(--f-disp);font-size:44px;font-weight:600;color:var(--navy);line-height:1}
.stat .u{font-size:17px;color:var(--muted);margin-left:4px;font-family:var(--f-body)}
.stat .l{font-size:16px;color:var(--muted);margin-top:8px;line-height:1.45}
.b-callout{border-left:5px solid var(--sky);background:var(--sky-50);padding:14px 20px;border-radius:0 10px 10px 0;font-size:var(--t-callout,18.5px);line-height:1.55;color:#1F2A3D}
.b-callout.amber{border-left-color:var(--amber);background:var(--amber-50)}
.b-callout b{color:var(--navy)}
.b-callout.note{font-size:15.5px;line-height:1.55;background:#fff;border-left-width:3px;padding:8px 14px;color:#3A4352}
.b-sec{display:flex;flex-direction:column;gap:7px;border-radius:10px}
.b-sec .sh{display:flex;align-items:center;gap:10px}
.b-sec .sno{flex:none;width:calc(var(--t-heading,20px)*1.3);height:calc(var(--t-heading,20px)*1.3);border-radius:7px;background:var(--sky);color:#fff;font:700 calc(var(--t-heading,20px)*.7)/calc(var(--t-heading,20px)*1.3) var(--f-body);text-align:center}
.b-sec h4{margin:0;font-size:var(--t-heading,20px);line-height:1.35;color:var(--navy)}
.b-sec .b-list{gap:5px;padding-left:calc(var(--t-heading,20px)*1.3 + 10px)}
.b-sec .b-list>li{font-size:var(--t-body,17.5px);line-height:1.5}
.b-sec .b-list>li::before{width:6px;height:6px;top:.66em}
.b-sec.ix.sel{outline-offset:6px}
.b-image{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:0}
.b-image img{max-width:100%;max-height:var(--mh,420px);object-fit:contain;border-radius:8px;border:1px solid var(--line);background:#fff}
.b-image figcaption{font-size:var(--t-caption,14.5px);color:var(--muted)}
/* v1.10.0 시간선(timeline) */
.b-tl{display:flex;flex-direction:column;align-items:stretch;gap:10px}
.b-tl .tl-ps{display:flex;gap:36px;align-items:flex-start;justify-content:center}
.b-tl .tl-p{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px}
.b-tl .tl-pt{font-size:var(--t-caption,14.5px);font-weight:700;color:var(--navy)}
.b-tl .tl-g2{display:grid;grid-template-columns:1fr;row-gap:2px;align-items:end}
.b-tl .tl-p.hl .tl-g2{grid-template-columns:auto 1fr;column-gap:14px}
.b-tl .tl-l{font-size:var(--t-caption,14.5px);color:var(--muted);font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:7px;height:calc(var(--t-body,17.5px)*1.9);align-self:end}
.b-tl .tl-l::before{content:'';width:10px;height:10px;border-radius:2px;background:var(--navy);flex:none}
.b-tl .tl-l.sky::before{background:var(--sky)} .b-tl .tl-l.amber::before{background:var(--amber)}
.b-tl .tl-in{position:relative;margin:0 var(--tlpad,48px)}
.b-tl .tl-arw{height:1.9em;font-size:var(--t-caption,14.5px)}
.b-tl .tl-ar{position:absolute;bottom:.35em;height:0;border-top:2px solid var(--sky)}
.b-tl .tl-ar::after{content:'';position:absolute;top:-6px;border:5px solid transparent}
.b-tl .tl-ar.r::after{right:0;border-left:10px solid var(--sky);border-right:0}
.b-tl .tl-ar.l::after{left:0;border-right:10px solid var(--sky);border-left:0}
.b-tl .tl-ar b{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);white-space:nowrap;font-weight:700;color:var(--navy)}
.b-tl .tl-vs{height:calc(var(--t-body,17.5px)*1.9);font-size:var(--t-body,17.5px)}
.b-tl .tl-v{position:absolute;top:50%;transform:translate(-50%,-50%);white-space:nowrap;background:#fff;padding:0 .3em;line-height:1.3;font-weight:700;color:var(--navy);z-index:1}
.b-tl .tl-v math{font-size:1.18em}
.b-tl .sky .tl-v{color:var(--sky);color:color-mix(in srgb,var(--sky) 72%,#0B1B2B)} .b-tl .amber .tl-v{color:var(--amber);color:color-mix(in srgb,var(--amber) 85%,#000)}
.b-tl .tl-gd{position:absolute;width:0;border-left:1.5px dashed var(--sky-200);border-left-color:color-mix(in srgb,var(--sky) 55%,#fff);top:0;bottom:-2px;transform:translateX(-50%)}
.b-tl .tl-gd.s{top:50%}
.b-tl .tl-ax{height:2px;background:var(--navy);margin-top:2px}
.b-tl .tl-tk{position:absolute;top:-7px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:0}

.b-row{display:grid;gap:24px;align-items:center}
.b-row>.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.pg{position:absolute;background:#fff;box-shadow:0 2px 16px rgba(27,40,69,.14)}

.hs .hn{position:absolute;left:-12px;top:-12px;width:24px;height:24px;border-radius:50%;background:var(--sky);color:#fff;font:700 13px/24px var(--f-body);text-align:center;box-shadow:0 0 0 3px #fff}

/* ---------- 강조·추가 설명 ---------- */
.ix{cursor:pointer;position:relative;transition:transform .18s ease,box-shadow .18s ease,opacity .2s ease}

tr.ix[data-note]>td:first-child::after{content:'+';display:inline-block;margin-left:7px;width:16px;height:16px;border-radius:50%;background:var(--sky);color:#fff;font:700 12px/16px var(--f-body);text-align:center;vertical-align:1px;text-indent:0;opacity:.85}
body.nomark .ix[data-note]::after,body.nomark tr.ix[data-note]>td:first-child::after{display:none}
.slide.focus .ix:not(.sel):not(.anc){opacity:.35}
.ix.sel:not(tr):not(.hs){outline:2.5px solid var(--sky);outline-offset:3px;box-shadow:0 18px 40px rgba(27,40,69,.22);transform:translateY(-3px);z-index:6}

.pop{position:absolute;z-index:50;width:440px;background:#fff;border-radius:12px;box-shadow:0 18px 50px rgba(15,26,46,.28),0 0 0 1px rgba(27,40,69,.08);padding:16px 20px 18px;display:none;border-top:4px solid var(--sky)}
.pop.on{display:block;animation:popin .15s ease}
@keyframes popin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.pop .pk{font-family:var(--f-mono);font-size:12px;color:var(--sky);letter-spacing:.06em;margin-bottom:4px}
.pop .pt{font-size:19px;font-weight:700;color:var(--navy);margin:0 26px 8px 0;line-height:1.35}

.pop .pb p{margin:0 0 7px}.pop .pb p:last-child{margin:0}
.pop .px{all:unset;cursor:pointer;position:absolute;top:10px;right:12px;width:28px;height:28px;border-radius:50%;text-align:center;line-height:28px;font-size:19px;color:var(--muted)}

/* ---------- 모션 ---------- */
.rv{opacity:0;transform:translateY(var(--rvy,8px))}

.rvp{transform:scale(0)}
.slide.built .rv:not(.sel){opacity:1;transform:none;transition:opacity calc(.4s*var(--mk,1)) var(--ez),transform calc(.5s*var(--mk,1)) var(--ez)}

.notr *,.nz{transition:none!important}

@keyframes ringdot{0%{box-shadow:0 0 0 0 rgba(74,144,194,.7)}100%{box-shadow:0 0 0 11px rgba(74,144,194,0)}}

/* ---------- 한 단계씩 ---------- */

.slide.page .stepbtn{position:absolute;right:20px;top:14px;z-index:5;box-shadow:0 2px 8px rgba(27,40,69,.12)}
.nowb{position:absolute;left:12px;top:-13px;z-index:8;background:var(--sky);color:#fff;font:700 12px/1 var(--f-mono);padding:5px 9px;border-radius:999px;letter-spacing:.04em;white-space:nowrap;pointer-events:none;box-shadow:0 0 0 3px #fff}

/* ---------- 이동 링크 ---------- */

/* ---------- 서랍·말풍선·쪽 목록·시연 ---------- */

.open #scrim{opacity:1;pointer-events:auto}.open #drawer{transform:none}

#drawer .dn:hover{border-color:var(--sky);background:var(--sky-50)}
#drawer .dn b{display:block;font-size:15.5px;color:var(--navy);margin-bottom:3px}

#drawer .dh{font-family:var(--f-mono);font-size:12.5px;color:var(--sky);letter-spacing:.06em;margin:4px 0 6px}

#drawer .ul a{color:var(--navy)}

#tip{position:absolute;display:none;z-index:58;max-width:340px;background:#fff;border:1px solid var(--line);border-top:3px solid var(--sky);border-radius:8px;box-shadow:0 8px 24px rgba(15,26,46,.16);padding:8px 12px;font-size:14px;line-height:1.5;color:#232830;pointer-events:none}

#stage.ov{background:#E6EAF0}

#stage.ov>.slide:not(.active),#stage.ovx>.slide:not(.active),body:not([data-motion="rich"]) #stage.ov>.slide,body:not([data-motion="rich"]) #stage.ovx>.slide{transition:none!important}
#ovl{position:absolute;inset:0;z-index:20;pointer-events:none;opacity:0;transition:opacity .25s}
.ov #ovl{opacity:1}
#ovl .oh{position:absolute;left:36px;top:18px;font-size:19px;font-weight:700;color:var(--navy)}
#ovl .oh span{font-weight:500;font-size:13.5px;color:var(--muted);margin-left:12px}
#ovl .ovn{position:absolute;font:700 11px/1 var(--f-mono);background:var(--navy);color:#fff;padding:3px 5px;border-radius:4px}
#cursor{position:absolute;left:640px;top:360px;z-index:60;pointer-events:none;display:none;transition:left .75s var(--ez),top .75s var(--ez)}

#cursor.clk::after{content:"";position:absolute;left:-14px;top:-14px;width:28px;height:28px;border:3px solid var(--amber);border-radius:50%;animation:ck .5s ease-out 1 forwards}
@keyframes ck{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}
#dmtag,#toast{position:absolute;right:16px;top:12px;z-index:61;display:none;font-size:12.5px;font-weight:700;color:#fff;background:var(--amber);padding:5px 11px;border-radius:999px}

/* ---------- 화면 밖 조작 ---------- */
.nav{transition:opacity .3s;opacity:.15;position:fixed;right:18px;bottom:16px;display:flex;align-items:center;gap:4px;background:rgba(27,40,69,.92);border-radius:999px;padding:5px 8px;z-index:60;font-family:var(--f-mono);font-size:12px;color:#E6ECF5;user-select:none}

/* ---------- v1.2 모션 확장 (참조: motion-template.html) ---------- */
body[data-motion="rich"] .slide{transition:opacity calc(.45s*var(--mk,1)),transform calc(.55s*var(--mk,1)) var(--ez),visibility 0s calc(.45s*var(--mk,1))}

.b-bars{display:flex;flex-direction:column;gap:10px}

.b-sw{display:flex;flex-direction:column;gap:14px}

}

/* ---------- v1.3 수식 ---------- */
math{font-family:'Cambria Math','STIX Two Math','Latin Modern Math','Noto Sans Math',math}
.b-text math,.b-list math,.b-sec math,.card math,.b-table math,.b-callout math,.step math,.stat math,.lead math,.pop math,.nt math,.mt math,#drawer math{font-size:1.1em;padding:0 .1em}

.mq{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:16px;row-gap:6px;padding:16px 24px 16px 28px;background:var(--sky-50);border-radius:0 10px 10px 0}

.mtex{font-family:var(--f-mono);font-size:15px;color:var(--amber)}
math .ang{border-top:.065em solid currentColor;border-right:.065em solid currentColor;padding:0 .12em 0 .06em}
body[data-motion="rich"] .mq.rv::before{transform:scaleY(0)}
body[data-motion="rich"] .slide.built .mq.rv::before{transform:scaleY(1);transition:transform .6s var(--ez);transition-delay:inherit}

/* ---------- v1.4 개별 모션 (fx) ---------- */
.rv[data-fxe="fade"]{transform:none}
.rv[data-fxe="left"]{transform:translateX(-36px)}
.rv[data-fxe="right"]{transform:translateX(36px)}
.rv[data-fxe="drop"]{transform:translateY(-20px)}
.rv[data-fxe="pop"]{transform:scale(.84)}
tr.rv[data-fxe],thead.rv[data-fxe]{transform:none}
.slide.built .rv[data-fxe="pop"]:not(.sel){transition:opacity calc(.35s*var(--mk,1)) var(--ez),transform calc(.6s*var(--mk,1)) cubic-bezier(.34,1.56,.64,1)}
.rv[data-fxe="wipe"]:not(tr):not(thead){opacity:1;transform:none;clip-path:inset(0 100% 0 0)}

.slide.built .mq .res{background-color:rgba(74,144,194,.14);box-shadow:0 0 0 2px var(--sky)}
.rvl{position:relative}
.rvl>.rvl-in{transition:opacity .3s}
.rvl:not(.open)>.rvl-in{opacity:0}
.rvl-c{all:unset;box-sizing:border-box;position:absolute;inset:-4px;z-index:3;cursor:pointer;display:flex;align-items:center;justify-content:center;border:2px dashed var(--sky-200);border-radius:10px;background:#FBFCFE;color:var(--sky);font:700 16px/1.3 var(--f-body);transition:opacity .3s,visibility 0s .3s}

@keyframes fillin{0%{opacity:0;transform:translateY(10px);box-shadow:0 0 0 8px var(--sky-50)}55%{opacity:1;transform:none}100%{box-shadow:0 0 0 0 rgba(238,245,251,0)}}

  .rv[data-fxe]{clip-path:none!important}

  .rvl>.rvl-in{opacity:1!important;animation:none!important}
}

/* ---------- v1.5 자유 배치·배율 ---------- */
.blk[data-scale]{zoom:var(--bz,1)}

/* ---------- v1.6 새 블록·양식 ---------- */
body{--c1:var(--sky);--c2:var(--navy);--c3:var(--sky-200);--c4:var(--amber);--c5:#B7BDC5;--t1:var(--navy);--acc:var(--amber)}
.fn{position:absolute;left:62px;right:62px;bottom:44px;font-size:var(--t-footnote,12.5px);line-height:1.4;color:var(--muted);max-height:2.8em;overflow:hidden}
.slide.hasfn{padding-bottom:90px}
.b-row>.col.panel{align-self:stretch;justify-content:center;background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
.col.panel .stat{background:none;border:0;padding:0}
.nrows{width:100%;border-collapse:collapse;margin:2px 0 10px;font-size:.95em}
.nrows td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}
.nrows td+td{text-align:right;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;padding-left:14px;white-space:nowrap}
.nt-b .nrows{font-size:12.5px;margin:2px 0 6px}
.nt-b .nrows td{padding:2px 0}
.pc1{background:var(--c1)}.pc2{background:var(--c2)}.pc3{background:var(--c3)}.pc4{background:var(--c4)}.pc5{background:var(--c5)}
.bar-row .bf.c1{background:var(--c1)}.bar-row .bf.c2{background:var(--c2)}.bar-row .bf.c3{background:var(--c3)}.bar-row .bf.c4{background:var(--c4)}.bar-row .bf.c5{background:var(--c5)}
.b-stack,.b-grid{display:flex;flex-direction:column;gap:8px}
.sk-t,.gd-t,.sm-ct{font-size:15px;font-weight:600;color:var(--muted)}
.b-stack .cap,.b-grid .cap,.b-sim .cap{font-size:var(--t-caption,14.5px);color:var(--muted)}
.sk-bar{display:flex;height:44px}
.sk-seg{position:relative;display:flex;align-items:center;min-width:0;padding:0 10px;color:#fff;font-size:15.5px;font-weight:700;white-space:nowrap;transform-origin:left center;cursor:default}
.sk-seg.pc3,.sk-seg.pc5{color:var(--navy)}
.sk-seg i{font-style:normal;overflow:hidden;text-overflow:ellipsis}
.sk-seg:first-child{border-radius:6px 0 0 6px}.sk-seg:last-child{border-radius:0 6px 6px 0}
.sk-seg.ix{cursor:pointer}
.sk-vals{display:flex}
.sk-vals>span{min-width:0;font-size:14px;color:var(--muted);white-space:nowrap;padding-left:2px}
.sk-vals b{font-family:var(--f-disp);font-size:19px;font-weight:600;color:var(--navy);margin-right:2px}
.sk-sh{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.sk-st{font-size:15px;color:var(--muted)}
.sk-sr{display:flex;align-items:center;gap:14px}
.sk-trk{position:relative;flex:none;width:72%;height:30px;border:1.5px dashed var(--sky-200);border-radius:6px}
.sk-sf{position:absolute;left:-1.5px;top:-1.5px;bottom:-1.5px;width:calc(var(--s,0) * 100% + 3px);background:var(--sky);border-radius:6px;transform-origin:left center}
.sk-sp{font-family:var(--f-disp);font-size:24px;font-weight:600;color:var(--sky)}
.gd-body{display:flex;gap:28px;align-items:flex-start}
.gd-leg{display:flex;flex-direction:column;gap:14px;flex:0 1 240px;min-width:140px}
.gd-li{display:grid;grid-template-columns:16px 1fr;column-gap:10px;row-gap:2px;align-items:center}
.gd-li .gd-sw{width:16px;height:16px;border-radius:3px;grid-row:span 2}
.gd-li b{font-size:19px;line-height:1.3;color:var(--navy)}
.gd-li small{grid-column:2;font-size:14.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.gd-cells{flex:none;display:flex;flex-direction:column;gap:4px}
.gd-row{display:grid;grid-template-columns:repeat(10,26px);gap:4px}
.gd-row i{display:block;height:22px;border-radius:2px}
.gd-row i:hover{outline:2px solid var(--ink);outline-offset:0}
.b-sim{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;align-items:stretch}
.sm-main{display:flex;flex-direction:column;gap:10px;min-width:0}
.sm-tgs{display:flex;gap:8px;flex-wrap:wrap}
.sm-t{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1.5px solid var(--sky);border-radius:8px;background:#fff;color:var(--sky);font:700 14.5px/1.2 var(--f-body)}
.sm-t i{width:15px;height:15px;border:2px solid currentColor;border-radius:3px;display:grid;place-items:center;font:700 11px/1 var(--f-body);font-style:normal}
.sm-t[aria-pressed="true"]{background:var(--sky);color:#fff}
.sm-t[aria-pressed="true"] i::after{content:'✓'}
.sm-row{display:grid;grid-template-columns:170px 1fr 96px;align-items:center;gap:16px;min-height:52px;border-bottom:1px solid var(--line)}
.sm-row label{font-size:16.5px;font-weight:700;line-height:1.25;color:var(--navy)}
.sm-row label small{display:block;margin-top:2px;font-size:12.5px;font-weight:400;color:var(--muted)}
.sm-row input{width:100%;margin:0;accent-color:var(--sky);cursor:pointer}
.sm-row output{font-family:var(--f-disp);font-size:20px;font-weight:600;color:var(--sky);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.sm-ch{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.sm-br,.sm-ax{display:grid;grid-template-columns:110px 1fr 120px;align-items:center;gap:12px}
.sm-bl{font-size:15.5px;font-weight:700;color:var(--navy)}
.sm-bt{height:28px;background:var(--gray-50);border-radius:6px;overflow:hidden}
.sm-bf{display:block;height:100%;width:calc(var(--s,0) * 100%);background:var(--sky);border-radius:6px;transform-origin:left center;transition:width .9s var(--ez)}
.sm-bf.base{background:var(--sky-200)}
.sm-bv{font-family:var(--f-disp);font-size:19px;font-weight:600;color:var(--navy);white-space:nowrap;font-variant-numeric:tabular-nums}
.sm-ax{font-size:12.5px;color:var(--muted);margin-top:-4px}
.sm-ax>span:nth-child(2){display:flex;justify-content:space-between}
.sm-ax i{font-style:normal}
.sm-st{font-size:14.5px;font-weight:700;color:var(--sky);min-height:20px}
.sm-side{display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:18px 22px}
.sm-lb{font-size:14px;font-weight:700;color:var(--sky)}
.sm-big{font-family:var(--f-disp);font-size:48px;font-weight:600;line-height:1.05;color:var(--navy);white-space:nowrap;font-variant-numeric:tabular-nums}
.sm-big small{font-family:var(--f-body);font-size:20px;color:var(--muted);margin-left:4px}
.sm-ex{font-size:15px;font-weight:700;color:var(--sky)}
.sm-ex:empty{display:none}
.sm-dt{font-size:16px;font-weight:700;color:var(--navy)}
.sm-eq{font-size:13.5px;line-height:1.5;color:var(--muted)}
.sm-dl{border-top:1px solid var(--line);margin-top:4px}
.sm-dl div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.sm-dl b{white-space:nowrap;font-variant-numeric:tabular-nums}
.sm-xp{margin:4px 0 0;font-size:13.5px;line-height:1.5;color:#3A4352}
.sm-rs{all:unset;cursor:pointer;align-self:flex-start;margin-top:auto;padding:7px 12px;border:1.5px solid var(--sky);border-radius:999px;color:var(--sky);font:700 13px/1 var(--f-body)}
.sm-rs:hover{background:var(--sky);color:#fff}
.sm-err{padding:12px 14px;border:1.5px dashed #E4A3A0;border-radius:8px;color:#B42318;font-size:15px}
.b-sim.sm-bad{display:block}
.b-text.ix[data-note],.b-callout.ix[data-note]{padding-right:32px}
.sk-seg.rvg,.sk-sf.rvg,.sm-bf.rvg{transform:scaleX(0)}
.slide.built .sk-seg.rvg,.slide.built .sk-sf.rvg{transform:scaleX(1);transition:transform calc(.7s*var(--mk,1)) var(--ez)}
.slide.built .sm-bf.rvg{transform:scaleX(1);transition:transform calc(.9s*var(--mk,1)) var(--ez),width calc(.9s*var(--mk,1)) var(--ez)}
@media print{
  .sk-seg,.sk-sf,.sm-bf{transform:none!important}
  .sm-rs{display:none!important}
}

/* ---------- v1.6 Klein 스타일 (theme.style: "klein", 참조: motion-template.html) ---------- */
body[data-style="klein"]{
  --ink:#222;--sky:#002FA7;--navy:#001C64;--cream:#FFFFFF;
  --sky-50:#EAEEF8;--sky-100:#D9E0F2;--sky-200:#99ACDB;
  --line:#D0D6DE;--muted:#6B7C85;--soft:#6B7C85;
  --amber:#C25E00;--amber-50:#FFF1E3;--amber-200:#FFC896;--gray-50:#EEF0F2;
  --t1:#4D6DC1;--acc:#FF7A00;
  --c1:var(--sky);--c2:#4D6DC1;--c3:#99ACDB;--c4:#FF7A00;--c5:#B7BDC5;
  --f-disp:var(--f-body);--f-mono:var(--f-body);
  background:#161C20}
body[data-style="klein"] .wm{font-family:'Fraunces','Pretendard Variable','Pretendard',Georgia,serif;color:#1B2845}
body[data-style="klein"] .wm b{color:#4A90C2}
body[data-style="klein"] .slide.content{padding:40px 58px 66px}
body[data-style="klein"] .slide.hasfn{padding-bottom:90px}
body[data-style="klein"] .slide::before{display:none}
body[data-style="klein"] .hd{margin-bottom:16px}
body[data-hrule="on"] .slide.content .hd{padding-bottom:12px;border-bottom:1.5px solid var(--sky-200);border-bottom-color:color-mix(in srgb,var(--sky) 60%,#fff);margin-bottom:var(--hgap,24px)}
body[data-style="klein"][data-hrule="on"] .slide.content .hd{border-bottom-color:#B9C0CC}
body[data-style="klein"] .kicker{font-size:var(--t-kicker,19px);font-weight:700;letter-spacing:0;color:var(--sky);gap:10px}
body[data-style="klein"] .kicker .no,body[data-style="klein"] .kicker .bar{display:none}
body[data-style="klein"] .kicker .ph{border-radius:0;border-color:var(--sky);color:var(--sky);font-size:13px;font-weight:700;padding:3px 9px}
body[data-style="klein"] .kicker .topic{border-radius:0;font-size:var(--t-topic,var(--t-kicker,15px));font-weight:700;color:var(--ink);background:#EAEEF8;border-color:#D5DCEB;border-left-color:var(--sky)}
body[data-style="klein"] .kicker .topic .tp-n{font-family:var(--f-body);border-left-color:#C9D2E6}
body[data-style="klein"] h2{color:var(--ink);line-height:1.25;letter-spacing:-.02em}
body[data-style="klein"] .lead{font-size:var(--t-lead,17px);font-weight:700;color:var(--ink);margin-top:10px}
body[data-style="klein"] .fn{left:58px;right:58px;bottom:40px;font-size:var(--t-footnote,12px)}
body[data-style="klein"] .ft{left:58px;right:58px;bottom:14px;border-top:0;padding-top:0;color:var(--muted)}
body[data-style="klein"] .slide.page .ft{left:20px;right:20px;bottom:10px}
body[data-style="klein"] .pv{border-radius:0;color:var(--sky);font-weight:700}
body[data-style="klein"] .pv:hover{border-color:var(--sky)}
body[data-style="klein"] .slide.cover{background:#fff;color:var(--ink)}
body[data-style="klein"] .slide.cover::after{content:'';position:absolute;left:0;top:0;bottom:0;width:22px;background:var(--sky)}
body[data-style="klein"] .gridbg{display:none}
body[data-style="klein"] .cover .in{left:100px;top:108px}
body[data-style="klein"] .cover .kk,body[data-style="klein"] .divider .kk{font-size:20px;font-weight:700;letter-spacing:0}
body[data-style="klein"] .cover h1{color:var(--ink);font-size:52px}
body[data-style="klein"] .cover .sub{color:var(--muted);font-size:21px}
body[data-style="klein"] .cover .line{width:64px;height:5px;background:var(--acc)}
body[data-style="klein"] .cover .meta{gap:0 22px;color:var(--ink);font-size:17px;border-top:1px solid var(--line)}
body[data-style="klein"] .cover .meta dt,body[data-style="klein"] .cover .meta dd{padding:10px 0;border-bottom:1px solid var(--line)}
body[data-style="klein"] .cover .meta dt{font-size:15px;font-weight:700;color:var(--sky);padding-top:11px}
body[data-style="klein"] .cover .cft{left:100px;color:var(--muted)}
body[data-style="klein"] .cover .wm{color:#1B2845}
body[data-style="klein"] .slide.divider{background:var(--sky)}
body[data-style="klein"] .divider .kk{color:var(--sky-100)}
body[data-style="klein"] .divider .num{font-weight:700;font-size:150px;letter-spacing:-.04em;color:rgba(255,255,255,.2)}
body[data-style="klein"] .divider p{color:var(--sky-100)}
body[data-style="klein"] .b-list>li::before{border-radius:0;width:7px;height:7px}
body[data-style="klein"] .b-list.num>li::before{border-radius:0;width:28px;height:28px;top:.05em;background:var(--sky);font:700 15px/28px var(--f-body)}
body[data-style="klein"] .card{border-radius:0;padding:18px 22px}
body[data-style="klein"] .card h3{color:var(--ink);font-size:var(--t-heading,20px)}
body[data-style="klein"] .card.sky{background:var(--sky-50);border-color:var(--sky-50)}
body[data-style="klein"] .card.navy{background:var(--sky);border-color:var(--sky)}
body[data-style="klein"] .card.navy p{color:#E3E9F6}
body[data-style="klein"] .tag{border-radius:0;font-weight:700;padding:4px 8px}
body[data-style="klein"] .stat{background:var(--sky-50);border:0;border-radius:0;padding:18px 22px}
body[data-style="klein"] .stat .v{font-size:52px;font-weight:700;color:var(--sky);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
body[data-style="klein"] .stat .u{font-size:20px;color:var(--ink)}
body[data-style="klein"] .stat .l{font-size:16px;font-weight:500;color:var(--ink)}
body[data-style="klein"] .b-table th{background:none;color:var(--muted);font-weight:500;text-align:left;border-bottom:1.5px solid var(--ink);padding:8px 13px}
body[data-style="klein"] .b-table tbody tr:nth-child(even) td{background:none}
body[data-style="klein"] .b-table td.k{color:var(--ink)}
body[data-style="klein"] .b-table td.n{font-weight:700}
body[data-style="klein"] .b-table th.n{text-align:right}
body[data-style="klein"] .b-table th.c{text-align:center}
body[data-style="klein"] tr.ix:hover td{background:var(--sky-50)!important}
body[data-style="klein"] tr.ix.sel td{background:var(--sky-100)!important}
body[data-style="klein"] .step{background:#fff;border:1px solid var(--line);border-radius:0}
body[data-style="klein"] .step .sn{font-weight:700;font-size:24px}
body[data-style="klein"] .step .who{border-radius:0;background:var(--sky)}
body[data-style="klein"] .step h4{color:var(--ink)}
body[data-style="klein"] .step .arr{font-size:0;top:calc(50% - 16px)}
body[data-style="klein"] .step .arr::after{content:'›';font:700 32px/1 var(--f-body);color:var(--t1)}
body[data-style="klein"] .b-callout{border-radius:0;color:var(--ink)}
body[data-style="klein"] .b-callout b{color:var(--sky)}
body[data-style="klein"] .b-callout.amber{border-left-color:var(--acc)}
body[data-style="klein"] .b-sec,body[data-style="klein"] .b-sec .sno{border-radius:0}
body[data-style="klein"] .b-sec h4{color:var(--ink)}
body[data-style="klein"] .b-image img{border-radius:0}
body[data-style="klein"] .bar-row .bt,body[data-style="klein"] .bar-row .bf{border-radius:0}
body[data-style="klein"] .bar-row .bl{color:var(--ink);font-weight:700}
body[data-style="klein"] .bar-row .bv>b{font-weight:700;color:var(--ink)}
body[data-style="klein"] .bar-row .bf.navy{background:var(--t1)}
body[data-style="klein"] .bar-row .bf.amber{background:var(--acc)}
body[data-style="klein"] .sw-tabs{border-radius:0}
body[data-style="klein"] .sw-b{border-radius:0!important;color:var(--sky)}
body[data-style="klein"] .sw-b.on{color:#fff}
body[data-style="klein"] .mq,body[data-style="klein"] .mq .res{border-radius:0}
body[data-style="klein"] .slide.built .mq .res{background-color:rgba(0,47,167,.1)}
body[data-style="klein"] .ix:not(tr):not(.hs):hover{transform:none;box-shadow:none;outline:2px solid var(--sky);outline-offset:3px}
body[data-style="klein"] .ix[data-note]:not(tr):not(.hs)::after{border-radius:0;width:18px;height:18px;font:700 14px/18px var(--f-body);opacity:1}
body[data-style="klein"] tr.ix[data-note]>td:first-child::after{border-radius:0}
body[data-style="klein"] .stat.ix[data-note]:not(tr):not(.hs)::after{content:'내역 보기 ›';width:auto;height:auto;top:14px;right:16px;background:none;color:var(--sky);font:700 13px/1 var(--f-body)}
body[data-style="klein"] .ix.sel:not(tr):not(.hs){outline:2px solid var(--sky);outline-offset:3px;box-shadow:inset 0 5px 0 var(--sky);transform:none}
body[data-style="klein"] .slide.stepping .ix.sel:not(tr):not(.hs){box-shadow:inset 0 5px 0 var(--sky)}
body[data-style="klein"] .nowb{border-radius:0;box-shadow:none;left:-1px;top:-24px;padding:4px 10px;letter-spacing:0}
body[data-style="klein"] td>.nowb{top:-22px}
body[data-style="klein"] .stepbtn{border-radius:0;padding:5px 12px}
body[data-style="klein"] .go{border:1.5px solid var(--sky);border-radius:0;padding:4px 10px;color:var(--sky)}
body[data-style="klein"] .go:hover{background:var(--sky);color:#fff;border-color:var(--sky)}
body[data-style="klein"] .pop,body[data-style="klein"] .pop .px{border-radius:0}
body[data-style="klein"] .pop .pk{font-weight:700;letter-spacing:0}
body[data-style="klein"] .pop .pt,body[data-style="klein"] #drawer h3{color:var(--ink)}
body[data-style="klein"] #drawer{border-left:0}
body[data-style="klein"] #drawer .dn{border-radius:0;background:#fff}
body[data-style="klein"] #drawer .dp,body[data-style="klein"] #drawer .dh{font-weight:700;letter-spacing:0}
body[data-style="klein"] #tip{border-radius:0;border-top:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.14)}

body[data-style="klein"] .rvl-c{border-radius:0;border-color:var(--c5);background:#fff;color:var(--muted)}

body[data-style="klein"] .slide.page{background:var(--gray-50)}
body[data-style="klein"] .pg{box-shadow:none;outline:1px solid var(--line)}
body[data-style="klein"] .hs,body[data-style="klein"] .hs .hn{border-radius:0}
body[data-style="klein"] .hs .hn{box-shadow:none}
body[data-style="klein"] #stage.ov{background:var(--gray-50)}
body[data-style="klein"] #stage.ov>.slide:not(.notes-page){outline-color:var(--line)}
body[data-style="klein"] #stage.ov>.slide:not(.notes-page):hover{outline-color:var(--sky)}
body[data-style="klein"] #stage.ov>.slide.active{outline-color:var(--navy)}
body[data-style="klein"] #ovl .ovn,body[data-style="klein"] .nt-h .nt-no{border-radius:0;background:var(--sky)}
body[data-style="klein"] #ovl .oh,body[data-style="klein"] .nt-h{color:var(--ink)}
body[data-style="klein"] .nrows td+td{color:var(--ink)}
body[data-style="klein"] .b-row>.col.panel{background:var(--sky-50);border:0;border-radius:0;padding:22px 26px}
body[data-style="klein"] .col.panel .stat{background:none;padding:0}
body[data-style="klein"] .sk-seg,body[data-style="klein"] .sk-trk,body[data-style="klein"] .sk-sf,body[data-style="klein"] .gd-li .gd-sw,body[data-style="klein"] .gd-row i{border-radius:0}
body[data-style="klein"] .sk-seg.pc3,body[data-style="klein"] .sk-seg.pc5{color:var(--navy)}
body[data-style="klein"] .sk-vals b,body[data-style="klein"] .sk-sp{font-weight:700;color:var(--sky)}
body[data-style="klein"] .sk-trk{border-color:var(--t1)}
body[data-style="klein"] .gd-li b{color:var(--sky);font-weight:700}
body[data-style="klein"] .sm-t,body[data-style="klein"] .sm-t i,body[data-style="klein"] .sm-bt,body[data-style="klein"] .sm-bf,body[data-style="klein"] .sm-rs{border-radius:0}
body[data-style="klein"] .sm-row label,body[data-style="klein"] .sm-bl{color:var(--ink)}
body[data-style="klein"] .sm-row output{font-weight:700}
body[data-style="klein"] .sm-bf.base{background:var(--sky-200)}
body[data-style="klein"] .sm-bv{font-weight:700;color:var(--ink)}
body[data-style="klein"] .sm-side{background:var(--sky-50);border:0;border-radius:0;padding:22px 26px}
body[data-style="klein"] .sm-big{font-weight:700;color:var(--sky);letter-spacing:-.03em}

  var run=++RUN; DM=1; stage.classList.add('dm'); $('#dm').classList.add('on');
  var alive=function(){ return DM&&run===RUN; }, Q=LV==='none';
  async function click(el,only){ var r=el.getBoundingClientRect(), p=stagePt(r.left+Math.min(r.width/2,180),r.top+Math.min(r.height/2,46)); cz.style.left=p.x+'px'; cz.style.top=p.y+'px'; await sl(Q?30:760); if(!alive()) return false; cz.classList.remove('clk'); void cz.offsetWidth; cz.classList.add('clk'); if(!only) el.dispatchEvent(new MouseEvent('click',{bubbles:true})); return true; }
  if(isOv()) ovOff();
  for(var i=(cur>=total-1?0:cur);i<total;i++){
    if(!alive()) return; if(i!==cur) show(i); else build(slides[i]);
    await sl(Q?60:(plain(slides[i])?2600:1800)); if(!alive()) return;
    var s=slides[i];
    if(s._steps){ var b=$('.stepbtn',s); for(var k=0;k<=s._steps.length;k++){ if(!(await click(b))) return; await sl(Q?60:(k<s._steps.length?2600:900)); if(!alive()) return; } }
    else if(!plain(s)){ var its=$$('.ix[data-note]',s).slice(0,2); for(var j=0;j<its.length;j++){ if(!(await click(its[j]))) return; await sl(Q?60:3200); if(!alive()) return; clearSel(); await sl(Q?20:350); } }
    var rcs=$$('.rvl:not(.open) > .rvl-c',s).slice(0,3); for(var q=0;q<rcs.length;q++){ if(!(await click(rcs[q]))) return; await sl(Q?60:2000); if(!alive()) return; }
    var sims=$$('.b-sim[data-sim]',s); for(var y=0;y<sims.length;y++){ var se=sims[y], ins=$$('input',se), SV=se._b.variables;
      for(var q2=0;q2<ins.length;q2++){ if(!(await click(ins[q2],1))) return; var vv=SV[q2]; ins[q2].value=Math.min(vv.max,vv.default+vv.step*Math.max(1,Math.round((vv.max-vv.min)/vv.step/4))); ins[q2].dispatchEvent(new Event('input',{bubbles:true})); await sl(Q?60:1300); if(!alive()) return; }
      var tgs=$$('.sm-t',se); for(var q3=1;q3<=tgs.length;q3++){ if(!(await click(tgs[q3%tgs.length]))) return; await sl(Q?60:1300); if(!alive()) return; }
      if(!(await click($('.sm-rs',se)))) return; await sl(Q?60:1200); if(!alive()) return; }
    var sws=$$('.b-sw',s); for(var w=0;w<sws.length;w++){ var sbs=$$(':scope > .sw-tabs > .sw-b',sws[w]); for(var z=1;z<=sbs.length;z++){ if(!(await click(sbs[z%sbs.length]))) return; await sl(Q?60:2400); if(!alive()) return; } }
    await sl(Q?20:500);
  }
  if(alive()) stopDemo();
}
addEventListener('pointerdown',function(e){ if(DM&&e.isTrusted&&!e.target.closest('#dm')) stopDemo(); },true);

/* ---------- 모션 단계 바꾸기 (M) ---------- */
function setStyle(st){ STY=st==='klein'?'klein':'tkleen'; document.body.dataset.style=STY; clearSel(); hideTip(); fitText(); build(slides[cur]); toast('스타일: '+(STY==='klein'?'Klein':'기본 (tkLeen)')); }
var NB='', NT=0;
function numGo(){ clearTimeout(NT); var n=parseInt(NB,10); NB=''; if(n>=1&&n<=total) show(n-1,{jump:n-1!==cur}); else if(n) toast(n+'쪽은 없습니다'); }
function setLevel(l){ LV=l; FX=calcFX(false); document.body.dataset.motion=LV; slides.forEach(function(s){ s._seen=0; }); build(slides[cur]); toast('모션: '+{none:'없음',basic:'기본',rich:'풍부'}[LV]); }

/* ---------- 조작 ---------- */
function fit(){ var sc=Math.min(innerWidth/1280,innerHeight/720)*0.98; stage.style.transform='scale('+sc+')'; }
$('#prev').onclick=function(){show(cur-1);}; $('#next').onclick=function(){show(cur+1);};
$('#mk').onclick=function(){document.body.classList.toggle('nomark');};
$('#ovb').onclick=function(){ov();}; $('#dm').onclick=function(){demo();};
$('#fs').onclick=function(){ if(!document.fullscreenElement){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();} else {document.exitFullscreen&&document.exitFullscreen();} };
document.addEventListener('keydown',function(e){
  var k=e.key, c=e.code; if(DM&&c!=='KeyD') stopDemo();
  if(e.target.matches&&e.target.matches('input,textarea,select,[contenteditable]')) return;
  if(k==='Escape'){ if(stage.classList.contains('open')) closeDr(); else if(isOv()) ovOff(); else if(selEl||slides[cur]._sp){ clearSel(); resetStep(slides[cur]); } else back(); return; }
  if(k==='Enter'&&NB){ e.preventDefault(); numGo(); return; }
  if(/^(Digit|Numpad)[0-9]$/.test(c)&&!e.ctrlKey&&!e.metaKey&&!e.altKey){ NB=(NB+c.slice(-1)).replace(/^0+/,'').slice(-3); if(NB){ toast(NB+'쪽으로 이동 · Enter'); clearTimeout(NT); NT=setTimeout(numGo,1100); } return; }
  if(k==='ArrowRight'||k==='PageDown'||k===' '||k==='Enter'){ e.preventDefault(); show(cur+1); }
  else if(k==='ArrowLeft'||k==='PageUp'||k==='Backspace'){ e.preventDefault(); show(cur-1); }
  else if(k==='Home') show(0); else if(k==='End') show(total-1);
  else if(c==='KeyF') $('#fs').click(); else if(c==='KeyN') document.body.classList.toggle('nomark');
  else if(c==='KeyO') ov(); else if(c==='KeyD'){ e.preventDefault(); demo(); }
  else if(c==='KeyS'){ if(slides[cur]._steps) stepNext(slides[cur]); }
  else if(c==='KeyI'){ if(stage.classList.contains('open')) closeDr(); else openDr(); }
  else if(c==='KeyM'){ setLevel(LV==='basic'?'rich':LV==='rich'?'none':'basic'); }
  else if(c==='KeyR'){ openRvl($('.rvl:not(.open)',slides[cur])); }
  else if(c==='KeyT'){ setStyle(STY==='klein'?'tkleen':'klein'); }
});
var tx=null;

var nav=$('#nav'), hint=$('#hint'), ht;

/* ---------- 넘침 자동 맞춤 ---------- */
var OVER=[];
function fitText(){
  OVER=[];
  slides.forEach(function(s,i){
    var bd=$('.bd',s), bi=$('.bdi',s); if(!bd||!bi) return; bi.style.zoom='';
    if(s.classList.contains('free')){ var R=bi.getBoundingClientRect(); if($$('.bdi > [data-box]',s).some(function(e){ var c=e.matches('.rvl')?e.firstElementChild:e, q=c.getBoundingClientRect(), st=e.style; return c.scrollHeight>e.clientHeight+2||c.scrollWidth>e.clientWidth+2||q.height>R.height*parseFloat(st.getPropertyValue('--bh'))/100+2||q.width>R.width*parseFloat(st.getPropertyValue('--bw'))/100+2; })) OVER.push(i+1); s.dataset.fit=1; return; }
    var mxs=$$('.mq .mx',s), wide=function(){ return mxs.some(function(x){ return x.scrollWidth>x.clientWidth+1; }); };
    mxs.forEach(function(x){ var mm=$('math',x); if(!mm) return; mm.style.fontSize=''; if(FIXED) return; var f=1; while(x.scrollWidth>x.clientWidth+1&&f>0.7){ f=Math.round((f-0.05)*100)/100; mm.style.fontSize='calc(var(--msz,var(--t-math,26px)) * '+f+')'; } });
    var k=1, H2=function(){return bd.getBoundingClientRect().height;};
    if(TOP){ var g=$('.sg',s)?SGMAX:0; s.style.setProperty('--sg',g+'px'); while(g>0&&bi.getBoundingClientRect().height>H2()+1){ g=Math.max(0,g-4); s.style.setProperty('--sg',g+'px'); } s.dataset.sg=g; }
    while(!FIXED&&bi.getBoundingClientRect().height>H2()+1&&k>0.77){ k=Math.round((k-0.04)*100)/100; bi.style.zoom=k; }
    if(!FIXED&&k===1&&meta.fitUp!==false&&bi.getBoundingClientRect().height<H2()*0.8){
      var up=1; while(up<1.2){ var nk=Math.round((up+0.04)*100)/100; bi.style.zoom=nk; if(bi.getBoundingClientRect().height>H2()*0.92){ bi.style.zoom=(up===1?'':up); break; } up=nk; }
      k=up;
    }
    if(k>1&&wide()){ bi.style.zoom=''; k=1; }
    if(bi.getBoundingClientRect().height>H2()+1||wide()) OVER.push(i+1);
    s.dataset.fit=k;
  });
  if(OVER.length&&window.console) console.warn('내용이 넘치는 쪽:',OVER.join(', '));
}
fitText();
var m=parseInt((H||'').replace('#',''),10); show(isNaN(m)?0:m-1);

/* ---------- 인쇄용 부록 ---------- */
function buildNotes(){
  fitText();
  if(meta.printNotes===false){ window.__notesReady=true; return; }
  var items=[]; slides.forEach(function(s,i){ $$('[data-note]',s).forEach(function(el){ items.push({no:i+1,t:titleOf(el),el:el}); }); });
  if(!items.length){ window.__notesReady=true; return; }
  var pages=[], body=null;
  function newPage(){ var pg=document.createElement('section'); pg.className='slide notes-page'; pg.innerHTML='<header class="hd"><div class="kicker"><span class="no">+</span><span class="bar"></span>부록 · 추가 설명</div><h2>항목별 추가 설명</h2></header><div class="notes-body"></div>'; stage.insertBefore(pg,pop); pages.push(pg); body=pg.querySelector('.notes-body'); }
  newPage();
  items.forEach(function(it){ var d=document.createElement('div'); d.className='nt'; d.innerHTML='<div class="nt-h"><span class="nt-no">'+pad(it.no)+'</span>'+esc(it.t)+'</div><div class="nt-b">'+noteHTML(it.el)+'</div>'; body.appendChild(d); if(body.scrollWidth>body.clientWidth+2){ body.removeChild(d); newPage(); body.appendChild(d); } });
  pages.forEach(function(pg,k){ pg.querySelector('h2').textContent='항목별 추가 설명 ('+(k+1)+'/'+pages.length+')'; var f=document.createElement('footer'); f.className='ft'; f.innerHTML='<span>'+esc(meta.footer||meta.title||'')+' · 부록</span><span class="r">'+brand()+'<span>NOTE '+(k+1)+' / '+pages.length+'</span></span>'; pg.appendChild(f); });
  window.__notesReady=true;
}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(buildNotes);
