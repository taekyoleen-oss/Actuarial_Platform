<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>tkLeen 카드뉴스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
/* tkLeen 카드뉴스 렌더러 — 데이터(JSON)만 바꾸면 같은 배치·다른 테마로 렌더된다.
   빌드: python cards_build.py build cards-template.html cards.json out.html */
:root{
  --fg:#171a20; --body:#393c41; --tert:#5c5e62; --line:#eeeeee; --page:#fafaf7;
  --accent:#3e6ae1; --dark:#1b2845; --light:#8fb4f0; --soft:#e8eef9; --ink:#2b4a8c;
  --amber-bg:#f7eedc; --amber-fg:#7d5a14; --rose-bg:#f8e8e6; --rose-fg:#a03e33;
  --teal-bg:#e3f1ef; --teal-fg:#1f6e64; --violet-bg:#eee9f7; --violet-fg:#5b4493;
  --slate-bg:#eaedf1; --slate-fg:#475266; --green-bg:#e7f2e4; --green-fg:#3d6b2f;
  --cyan-bg:#e2f0f6; --cyan-fg:#1d6486;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page)}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--body);-webkit-font-smoothing:antialiased;padding:4px 24px 8px}
body.embed{background:transparent;padding:0 22px 4px}
html:has(body.embed){background:transparent}
b{font-weight:600;color:var(--fg)}
.wrap{max-width:600px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chipnav{border:1px solid var(--line);background:#fff;color:var(--body);border-radius:999px;padding:4px 10px;font:500 12px/1.4 inherit;cursor:pointer;transition:color .33s,background .33s,border-color .33s}
.chipnav:hover{color:var(--accent)}
.chipnav.on{background:var(--accent);border-color:var(--accent);color:#fff}
.count{margin-left:auto;font-size:13px;color:var(--tert);font-variant-numeric:tabular-nums}
.stage{position:relative;margin-top:8px;outline:none}
.track{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(23,26,32,.04),0 4px 14px rgba(23,26,32,.06);scrollbar-width:none;cursor:grab;user-select:none;background:#fff}
.track::-webkit-scrollbar{display:none}
.track:active{cursor:grabbing}
.slide{flex:0 0 100%;width:100%;scroll-snap-align:start;display:flex}
@media (min-width:640px){.slide{overflow:hidden}}
@media (min-width:640px){.slide{aspect-ratio:1/1}}
.nav{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.92);color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 2px rgba(23,26,32,.04),0 4px 14px rgba(23,26,32,.06);transition:color .33s,opacity .2s}
.nav:hover{color:var(--accent)}
.nav[disabled]{opacity:0;pointer-events:none}
.prev{left:-20px}.next{right:-20px}
.dots{margin-top:12px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.dot{height:8px;width:8px;border-radius:999px;border:0;background:var(--line);cursor:pointer;transition:width .33s,background .33s}
.dot.on{width:20px;background:var(--accent)}

/* 슬라이드 틀 */
.s{display:flex;flex-direction:column;width:100%;background:#fff;padding:20px}
@media (min-width:640px){.s{padding:28px}}
.sec{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--accent)}
.s h3{margin-top:6px;font-size:21px;font-weight:700;line-height:1.375;color:var(--fg)}
@media (min-width:640px){.s h3{font-size:23px}}
.lead{margin-top:8px;font-size:14px;line-height:1.625}
.body{margin-top:16px;flex:1;display:flex;flex-direction:column;justify-content:space-evenly;gap:12px;font-size:13.5px;line-height:1.625}
.cap{font-size:12.5px;font-weight:600;color:var(--fg)}
.fine{font-size:11.5px;color:var(--tert)}
.tone-blue{background:var(--soft);color:var(--ink)}
.tone-amber{background:var(--amber-bg);color:var(--amber-fg)}
.tone-rose{background:var(--rose-bg);color:var(--rose-fg)}
.tone-teal{background:var(--teal-bg);color:var(--teal-fg)}
.tone-violet{background:var(--violet-bg);color:var(--violet-fg)}
.tone-slate{background:var(--slate-bg);color:var(--slate-fg)}
.tone-green{background:var(--green-bg);color:var(--green-fg)}
.tone-cyan{background:var(--cyan-bg);color:var(--cyan-fg)}
.chip{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:600;white-space:nowrap}
.item{border-top:1px solid var(--line);padding-top:10px}
.item .hd{display:flex;align-items:center;gap:8px}
.item .hd b{font-size:14.5px}
.item p{margin-top:4px}
.note{border-radius:8px;padding:10px 14px;font-size:13px;line-height:1.625}
.note b{color:inherit}
/* 막대 */
.vbars{margin-top:8px;display:flex;height:128px;align-items:flex-end;gap:20px;border-bottom:1px solid var(--line);padding:0 8px}
.vbar{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.vbar span{margin-bottom:4px;font-size:13px;font-weight:600;color:var(--fg)}
.vbar i{display:block;width:100%;max-width:64px;border-radius:4px 4px 0 0;background:var(--accent)}
.vlabels{margin-top:4px;display:flex;gap:20px;padding:0 8px;text-align:center;font-size:11.5px;color:var(--tert)}
.vlabels span{flex:1}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:12px;color:var(--tert)}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px}
.series{position:relative;margin-top:8px;display:flex;height:144px;align-items:flex-end;gap:3px;border-bottom:1px solid var(--line)}
.series .col{position:relative;flex:1;height:100%;display:flex;align-items:flex-end}
.series .a{position:absolute;bottom:0;width:100%;border-radius:2px 2px 0 0;background:var(--soft)}
.series .b{position:relative;width:100%;border-radius:2px 2px 0 0;background:var(--accent)}
.series .end{position:absolute;right:0;font-size:12px;font-weight:600}
.ticks{margin-top:4px;display:flex;justify-content:space-between;font-size:11px;color:var(--tert)}
.prog{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:8px}
.prow .l{width:40px;flex-shrink:0;font-size:12px;color:var(--tert)}
.prow .t{flex:1;height:20px;display:flex;overflow:hidden;border-radius:4px;background:var(--slate-bg)}
.prow .t i{display:block;height:100%}
.prow .r{width:86px;flex-shrink:0;text-align:right;font-size:11.5px;color:var(--fg);font-variant-numeric:tabular-nums}
/* 표 */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{padding:4px 8px 4px 0;font-weight:500;color:var(--tert);text-align:left;border-bottom:1px solid var(--line)}
td{padding:6px 8px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td:last-child,th:last-child{padding-right:0}
.c-key{color:var(--fg);font-weight:500}
.c-sub{font-size:11.5px;color:var(--tert)}
.c-val{text-align:right;font-weight:600;white-space:nowrap;color:var(--accent)}
.c-rank{text-align:right;white-space:nowrap;font-size:12px;font-weight:600;color:var(--tert)}
.c-rank.top{color:var(--accent)}
.c-center{text-align:center}
.c-sm{font-size:12px}
th.hl{color:var(--accent)}
td .sub{display:block;font-size:12px;color:var(--body);font-weight:400}
/* 비교·통계 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{border-radius:8px;padding:12px}
.box.outline{border:1px solid var(--line)}
.box.outline.hl{border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.box .bt{margin-top:8px;font-weight:600;color:var(--fg)}
.box .bx{margin-top:4px}
.box .lab{font-size:12px;color:var(--tert)}
.box.tone-blue .lab{color:var(--ink)}
.box .lab+.bt{margin-top:4px}
.box.filled .bx{font-size:12.5px;color:var(--body)}
.stats{display:grid;gap:8px;text-align:center}
.stat{border-radius:8px;padding:10px}
.stat .k{font-size:11.5px;color:var(--tert)}
.stat .v{margin-top:2px;font-size:17px;font-weight:700;color:var(--fg)}
.stat .u{font-size:11px;color:var(--body)}
ul.l,ol.l{margin-top:4px;display:flex;flex-direction:column;gap:4px;list-style:none}
ul.l.bul{list-style:disc;padding-left:16px;gap:2px}
.steps{display:flex;gap:12px;border-top:1px solid var(--line);padding-top:10px}
.steps .w{width:64px;flex-shrink:0}
.steps .st{font-size:15px;font-weight:700;color:var(--accent)}
.steps .tm{font-size:11.5px;color:var(--tert)}
.steps .tt{font-weight:600;color:var(--fg)}
.steps .tx{margin-top:2px;font-size:12.5px}
ol.check{display:flex;flex-direction:column;gap:8px;list-style:none}
ol.check li{display:flex;gap:12px}
ol.check .n{width:24px;height:24px;flex-shrink:0;border-radius:999px;background:var(--accent);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
ol.check .d{display:block;font-size:12.5px}
/* 표지 */
.cover{position:relative;display:flex;flex-direction:column;width:100%;background:var(--dark);color:#fff;padding:24px}
@media (min-width:640px){.cover{padding:32px}}
.cover .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.cover .kick{font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--light)}
.cover .motif{width:84px;height:84px;flex-shrink:0;color:var(--light)}
.cover .motif svg{width:100%;height:100%;display:block}
.cover h1{margin-top:8px;font-size:30px;font-weight:700;line-height:1.25;color:#fff}
@media (min-width:640px){.cover h1{font-size:36px}}
.cover h1 em{font-style:normal;color:var(--light)}
.cover .txt{margin-top:16px;font-size:15px;line-height:1.625;color:rgba(255,255,255,.8)}
.cover .txt b{color:#fff}
.cover .tags{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}
.cover .tags span{border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:4px 12px;font-size:12.5px}
.cover .toc{margin-top:auto;border-top:1px solid rgba(255,255,255,.2);padding-top:16px}
.cover .toc p{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.6)}
.cover .toc ol{margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;list-style:none;font-size:14px}
.cover .hint{margin-top:12px;font-size:12px;color:rgba(255,255,255,.5)}
.cover-gap{height:24px}
/* 모션 — 활성 장에서 [data-r]이 순서대로, 막대가 자라남 */
.slide [data-r]{opacity:0;transform:translateY(12px);transition:opacity .5s ease,transform .5s ease;transition-delay:calc(var(--i,0)*90ms)}
.slide.on [data-r]{opacity:1;transform:none}
.gy{transform-origin:bottom;transform:scaleY(0);transition:transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0ms)}
.gx{transform-origin:left;transform:scaleX(0);transition:transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0ms)}
.slide.on .gy,.slide.on .gx{transform:none}
@media (prefers-reduced-motion:reduce){.slide [data-r],.gy,.gx{transition:none!important;opacity:1!important;transform:none!important}}
</style>
</head>
<body>

<script type="application/json" id="deck">{"title": "한화생명 카티라이프수술보장특약", "keywords": ["수술", "연골재생"], "theme": "auto", "motif": "auto", "source": "content/exclusive-rights/분석보고서_한화생명_카티라이프수술보장특약.pdf (개발과정 요약서·공개 통계 기반, 작성일 미표기)", "cover": {"kicker": "보험 배타적사용권 분석 · 카드뉴스", "title": "무릎 연골을\n==되살리는 수술==에\n1,500만원", "text": "한화생명 **카티라이프수술보장특약(무배당)**은 특정 연골재생 수술을 업계 처음으로 정액 보장해, 생명보험협회에서 **배타적사용권 6개월**(2026.2.3~8월)을 받았습니다.", "tags": ["신의료기술 수술 정액 보장", "제약사 데이터로 위험률 산출"], "toc": ["① 내용·구조", "② 국내외 유사상품", "③ 리스크 진단", "④ 상품개선 제안"]}, "slides": [{"nav": "내용·구조", "section": "① 배타적사용권 내용·구조", "title": "왜 이런 특약이 나왔을까?", "lead": "무릎 연골이 닳으면 초기에는 약·물리치료, 말기에는 인공관절 수술을 합니다. 그 사이 '중간 단계' 환자에게는 마땅한 치료가 없었습니다.", "blocks": [{"type": "compare", "boxes": [{"label": "초기", "tone": "slate", "title": "약물·물리치료", "text": "증상 완화 위주"}, {"label": "중등도", "tone": "blue", "hl": true, "title": "카티라이프 수술", "text": "치료 공백을 메우는 재생치료"}, {"label": "말기", "tone": "slate", "title": "인공관절 치환", "text": "관절을 갈아 끼움"}]}, {"type": "item", "tag": "문제", "tone": "rose", "title": "좋은 치료가 생겼지만 약 1,500만원 비급여", "text": "건강보험이 적용되지 않아 환자가 비용을 모두 냅니다. 기존 보험도 이 수술을 따로 보장하지 않았습니다."}, {"type": "note", "text": "그래서 이 특약은 **'인공관절은 이르고 약물은 부족한'** 환자의 재생수술 비용을 정액으로 보장합니다."}]}, {"section": "① 배타적사용권 내용·구조", "title": "한눈에 보는 특약 구조", "blocks": [{"type": "table", "cols": ["key", ""], "rows": [["지급 사유", "보험기간 중 카티라이프 수술을 받으면\n최초 1회만 지급"], ["지급 금액", "정액 1,500만원\n실제 치료비에 맞춘 금액"], ["대상 손상", "무릎 연골손상 ICRS 3등급 이상\n말기 골관절염(KL 4등급)은 제외"], ["판매 방식", "시그니처 H통합건강보험에 붙이는 특약"]]}, {"type": "note", "text": "보험금은 **병에 걸렸을 때(진단)**가 아니라 **이 수술을 실제로 받았을 때** 나갑니다. 그래서 '누가 수술을 받게 되느냐'가 핵심입니다."}]}, {"section": "① 배타적사용권 내용·구조", "title": "카티라이프 수술은 어떻게 하나요?", "lead": "쉽게 말해 \"내 갈비뼈 연골 세포를 키워 무릎 손상 부위에 채워 넣는 수술\"입니다.", "blocks": [{"type": "steps", "items": [{"step": "1차 수술", "title": "갈비뼈(늑연골)에서 세포 채취", "text": "입원해서 환자 본인의 연골 세포를 떼어 냄"}, {"step": "배양", "time": "약 6~7주", "title": "세포를 키워 작은 구슬 모양으로", "text": "지름 약 1~1.5㎜ 알갱이(펠렛)로 만듦"}, {"step": "2차 수술", "title": "무릎 손상 부위에 이식", "text": "다시 입원해서 채워 넣으면 연골 조직이 재생"}]}, {"type": "note", "tone": "slate", "text": "본인 세포라 거부 반응 위험이 낮고 고령자도 쓸 수 있습니다. 수술이 두 번이라 **반복 시술은 현실적으로 어렵습니다.**"}]}, {"section": "① 배타적사용권 내용·구조", "title": "누구나 받을 수 있는 건 아니에요", "lead": "보험금은 정해진 손상 단계에 해당할 때만 나옵니다. 이 기준이 손해율과 역선택을 모두 좌우합니다.", "blocks": [{"type": "item", "tag": "포함", "tone": "teal", "title": "연골손상 ICRS 3~4등급 · 손상 면적 약 2~10㎠", "text": "ICRS는 연골이 얼마나 깊이 손상됐는지 나누는 국제 기준입니다. 3~4등급은 깊게 패인 중등도 이상 손상입니다."}, {"type": "item", "tag": "제외", "tone": "rose", "title": "골관절염 KL 4등급(말기)", "text": "엑스레이로 보는 골관절염 단계 중 가장 심한 단계로, 인공관절 수술 대상이라 보장에서 뺍니다."}, {"type": "note", "text": "식약처가 허가한 범위(효능·용법) 안에서 투여한 수술만 인정되고, 기준 시점은 **투약 처방일**입니다."}]}, {"section": "① 배타적사용권 내용·구조", "title": "보험금은 왜 1,500만원일까?", "lead": "실제 치료비를 그대로 반영한 금액입니다.", "blocks": [{"type": "vbars", "caption": "카티라이프 수술 비용 구성 (평균)", "bars": [{"label": "약제비", "value": 1200, "display": "약 1,200만원"}, {"label": "처치료", "value": 300, "display": "약 300만원"}, {"label": "보험금(정액)", "value": 1500, "display": "1,500만원"}]}, {"type": "item", "tag": "주의", "tone": "amber", "title": "병원마다 약제비가 달라요", "text": "상급종합병원 공시 약제비는 약 980만~1,860만원으로 차이가 큽니다. 싼 병원에서는 보험금이 실제 비용보다 많을 수 있습니다."}, {"type": "note", "tone": "slate", "text": "치료비에 맞춘 금액이라 '보험으로 이득을 보려는 수술'을 억제하는 논리가 일관됩니다."}]}, {"section": "① 배타적사용권 내용·구조", "title": "숫자로 보면 이렇습니다", "blocks": [{"type": "stats", "items": [{"label": "출시 2개월 가입", "value": "3.6만건"}, {"label": "50·60대 비중", "value": "약 80%"}, {"label": "부가율(보도)", "value": "약 40%", "sub": "다른 배타권 담보의 약 4배", "tone": "amber"}]}, {"type": "vbars", "caption": "치료별 평균 비용", "bars": [{"label": "카티라이프", "value": 1500, "display": "약 1,500만원"}, {"label": "카티스템", "value": 700, "display": "약 700만원"}, {"label": "인공관절", "value": 300, "display": "약 300만원"}]}, {"type": "note", "tone": "slate", "text": "높은 부가율은 경험 통계가 없는 신기술의 불확실성을 보험료에 반영한 것으로 **보고서는 해석합니다(추정).**"}]}, {"section": "① 배타적사용권 내용·구조", "title": "알고 보면 다른, 세 가지 표현", "blocks": [{"type": "item", "tag": "표현 1", "title": "'무릎 연골 수술 보장'", "text": "모든 연골 수술이 아니라 **카티라이프 수술 하나**만 보장합니다. 미세천공술 같은 다른 수술은 해당하지 않습니다."}, {"type": "item", "tag": "표현 2", "tone": "violet", "title": "'치료비 보장'", "text": "실제 쓴 돈만큼이 아니라 **정해진 금액(정액)**을 한 번 줍니다. 병원별 비용 차이와 무관합니다."}, {"type": "item", "tag": "표현 3", "tone": "amber", "title": "'수술자금 2,000만원'", "text": "개발 초기 MOU 문서에는 2,000만원, 최종 금액은 1,500만원입니다. 단계별 차이로 보이나 약관 금액을 확인해야 합니다."}, {"type": "note", "text": "가입 전에는 **약관의 최종 보험금과 적응증 기준**을 직접 확인하세요."}]}, {"section": "① 배타적사용권 내용·구조", "title": "무엇이 새로워 6개월 배타권을 받았나", "lead": "이 수술은 비급여 신기술이라 건강보험 통계에도, 보험업계 경험 통계에도 기록이 없습니다.", "blocks": [{"type": "table", "cols": ["key", "", "sm"], "head": ["필요한 데이터", "어디서", "구하기"], "hl": 2, "rows": [["무릎관절증 환자 수", "심평원 M17 통계", "쉬움(공개)"], ["카티라이프 시행 건수", "제약사 데이터(단독 MOU)", "어려움(독점)"], ["업계 경험위험률", "보험개발원", "없음"]]}, {"type": "note", "text": "한화생명은 치료제 회사(바이오솔루션)와 **단독 MOU**로 임상·판매 데이터를 받아 위험률을 직접 만들고 보험개발원 인가를 받았습니다. 이 데이터 협업이 독창성이자 진입장벽입니다."}]}, {"nav": "유사상품", "section": "② 국내외 유사상품", "title": "국내에는 비슷한 보장이 있을까?", "blocks": [{"type": "table", "cols": ["key", ""], "rows": [["카티스템(메디포스트)", "제대혈 줄기세포 연골재생술\n전용 정액 보장 없음, 수술비·실손에서 일부"], ["자가지방 SVF 주사", "2024.5 신의료기술 인정\n주사형·실손 중심"], ["미세천공술·자가골연골이식", "기존 연골 수술\n수술비 담보로 일부 보장"], ["특정수술비·신의료기술 수술비", "수술 종류별 포괄 정액\n카티라이프가 포함될 수도"]]}, {"type": "note", "text": "연골재생 치료는 여럿 있지만, **특정 재생수술을 전용·고액 정액으로 보장한 것은 이 특약이 처음**입니다."}]}, {"section": "② 국내외 유사상품", "title": "일본은 어떻게 보장할까?", "blocks": [{"type": "item", "tag": "일본", "title": "선진의료특약", "text": "공적보험이 안 되는 고가 신의료기술의 기술료를 한도 안에서 **실제 비용만큼(실손)** 보장합니다. 일본에서는 이 방식이 표준입니다."}, {"type": "item", "tag": "일본", "tone": "violet", "title": "자가배양연골(JACC)", "text": "일부는 공적보험이 적용돼, 민간보험은 본인 부담분을 메우는 보조 역할을 합니다."}, {"type": "item", "tag": "일본", "tone": "teal", "title": "재생의료(자가·지방 줄기세포)", "text": "자유진료로 제공되고 민간보험은 보완 역할을 합니다."}, {"type": "note", "text": "정액은 단순하고 알기 쉽지만 **병원별 가격차에 약합니다.** 또 신기술이 건강보험에 편입되면 '비급여' 전제가 흔들릴 수 있습니다."}]}, {"nav": "리스크", "section": "③ 리스크 진단", "title": "리스크 ① 가입자와     series: function(b, i){
      var max = b.max || Math.max.apply(null, b.a.concat(b.b)) * 1.02;
      var cols = b.a.map(function(av, k){ return '<div class="col"><i class="a gy" style="height:'+(av/max*100)+'%;'+d(k*35)+'"></i><i class="b gy" style="height:'+(b.b[k]/max*100)+'%;'+d(300+k*35)+'"></i></div>'; }).join('');
      var ea = b.endA ? '<span class="end" style="top:0;color:var(--ink)">'+md(b.endA)+'</span>' : '';
      var eb = b.endB ? '<span class="end" style="bottom:'+(b.b[b.b.length-1]/max*100+2)+'%;color:var(--accent)">'+md(b.endB)+'</span>' : '';
      return R(i, legend([{label:b.legend[0],color:'soft'},{label:b.legend[1],color:'blue'}], b.note) +
        '<div class="series">' + cols + ea + eb + '</div>' +
        (b.ticks ? '<div class="ticks">' + b.ticks.map(function(t){ return '<span>'+md(t)+'</span>'; }).join('') + '</div>' : ''));
    },
    progress: function(b, i){
      var c = b.colors || ['teal','blue'];
      return R(i, (b.caption ? '<p class="cap">'+md(b.caption)+'</p>' : '') + '<div class="prog">' +
        b.rows.map(function(r, k){ return '<div class="prow"><span class="l">'+md(r.label)+'</span><div class="t"><i class="gx" style="width:'+r.value+'%;background:'+bar(c[0])+';'+d(200+k*160)+'"></i><i style="flex:1;background:'+bar(c[1])+';opacity:.8"></i></div><span class="r">'+md(r.right || '')+'</span></div>'; }).join('') +
        '</div>' + (b.legend ? '<div style="margin-top:8px">' + legend([{label:b.legend[0],color:c[0]},{label:b.legend[1],color:c[1]}]) + '</div>' : ''));
    },
    table: function(b, i){
      var st = b.cols || [];
      var cell = function(v, k, head){
        var cls = st[k] ? 'c-' + st[k].split(' ').join(' c-') : '';
        if (head) return '<th class="'+(b.hl === k ? 'hl ' : '')+(st[k] && st[k].indexOf('center')>=0 ? 'c-center' : '')+'">'+md(v)+'</th>';
        if (v && typeof v === 'object') return '<td class="'+cls+'">'+chip(v.chip, v.tone)+'</td>';
        var s = String(v == null ? '' : v), parts = s.split('\n'), main = parts.shift();
        if (st[k] === 'rank' && /1/.test(main)) cls += ' top';
        return '<td class="'+cls+'">'+md(main) + (parts.length ? '<span class="sub">'+md(parts.join('\n'))+'</span>' : '') + '</td>';
      };
      return R(i, (b.caption ? '<p class="cap" style="margin-bottom:4px">'+md(b.caption)+'</p>' : '') + '<table>' +
        (b.head ? '<thead><tr>' + b.head.map(function(h, k){ return cell(h, k, true); }).join('') + '</tr></thead>' : '') +
        '<tbody>' + b.rows.map(function(r){ return '<tr>' + r.map(function(v, k){ return cell(v, k); }).join('') + '</tr>'; }).join('') + '</tbody></table>');
    },
    compare: function(b, i){
      return R(i, b.boxes.map(function(x){
        if (x.label) return '<div class="box filled '+tone(x.tone || 'slate')+'" style="color:inherit"><p class="lab">'+md(x.label)+'</p><p class="bt">'+md(x.title)+'</p><p class="bx">'+md(x.text)+'</p></div>';
        return '<div class="box outline'+(x.hl ? ' hl' : '')+'">' + (x.chip ? chip(x.chip, x.tone) : '') + '<p class="bt">'+md(x.title)+'</p><p class="bx">'+md(x.text)+'</p></div>';
      }).join(''), 'grid2');
    },
    stats: function(b, i){
      return R(i, b.items.map(function(x){ return '<div class="stat '+tone(x.tone || 'slate')+'" style="color:inherit"><p class="k">'+md(x.label)+'</p><p class="v">'+md(x.value)+'</p><p class="u">'+md(x.sub || '')+'</p></div>'; }).join(''),
        'stats', 'grid-template-columns:repeat('+b.items.length+',1fr)');
    },
    list: function(b, i){
      var tag = b.ordered ? 'ol' : 'ul';
      return R(i, (b.title ? '<p class="cap">'+md(b.title)+'</p>' : '') + '<'+tag+' class="l'+(b.bullets ? ' bul' : '')+'">' + b.items.map(function(t){ return '<li>'+md(t)+'</li>'; }).join('') + '</'+tag+'>');
    },
    steps: function(b, i){
      return b.items.map(function(x, k){ return R(i + k, '<div class="w"><p class="st">'+md(x.step)+'</p><p class="tm">'+md(x.time || '')+'</p></div><div><p class="tt">'+md(x.title)+'</p>' + (x.text ? '<p class="tx">'+md(x.text)+'</p>' : '') + '</div>', 'steps'); }).join('');
    },
    checklist: function(b, i){
      return R(i, '<ol class="check">' + b.items.map(function(x, k){ return '<li><span class="n">'+(k+1)+'</span><span><b>'+md(x.title)+'</b><span class="d">'+md(x.text || '')+'</span></span></li>'; }).join('') + '</ol>');
    }
  };
  var span = function(b){ return b.type === 'steps' ? b.items.length : 1; };

  function cover(c){
    return '<div class="cover">' +
      R(0, '<div class="top"><span class="kick">'+md(c.kicker || '')+'</span>' + (T.motifSvg ? '<span class="motif" aria-hidden="true">'+T.motifSvg+'</span>' : '') + '</div>') +
      R(1, '<h1>'+md(c.title)+'</h1>') +
      (c.text ? R(2, '<p class="txt">'+md(c.text)+'</p>') : '') +
      (c.tags ? R(3, c.tags.map(function(t){ return '<span>'+md(t)+'</span>'; }).join(''), 'tags') : '') +
      (c.toc ? R(4, '<p>'+md(c.tocTitle || '이 카드뉴스의 순서')+'</p><ol>' + c.toc.map(function(t){ return '<li>'+md(t)+'</li>'; }).join('') + '</ol>' + '<p class="hint">'+md(c.hint || '넘기기: 버튼 · 드래그 · 키보드 ← →')+'</p>', 'toc') : '') +
      '</div>';
  }
  function slide(s){
    var i = 0, out = R(i++, '<span class="sec">'+md(s.section)+'</span>') + R(i++, '<h3>'+md(s.title)+'</h3>');
    if (s.lead) out += R(i, '<p class="lead">'+md(s.lead)+'</p>');
    i = 3; var body = '';
    (s.blocks || []).forEach(function(b){
      if (!B[b.type]) { body += R(i, '<p style="color:#a03e33">알 수 없는 블록: '+esc(b.type)+'</p>'); i++; return; }
      body += B[b.type](b, s.lead ? i : i - 1); i += span(b);
    });
    return '<div class="s">' + out + '<div class="body">' + body + '</div></div>';
  }

  var slides = [cover(D.cover)].concat(D.slides.map(slide));
  var sections = [{label: D.cover.nav || '표지', start: 0}];
  D.slides.forEach(function(s, k){ if (s.nav) sections.push({label: s.nav, start: k + 1}); });
  var N = slides.length;
  var svgL = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>';
  var svgR = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';

  document.getElementById('app').innerHTML =
    '<div class="bar">' + sections.map(function(s, k){ return '<button type="button" class="chipnav" data-go="'+s.start+'">'+md(s.label)+'</button>'; }).join('') + '<span class="count"></span></div>' +
    '<div class="stage" tabindex="0" aria-roledescription="carousel"><div class="track">' +
      slides.map(function(h, k){ return '<div class="slide" aria-label="'+(k+1)+'/'+N+'">' + h + '</div>'; }).join('') +
    '</div><button type="button" class="nav prev" aria-label="이전 카드">'+svgL+'</button><button type="button" class="nav next" aria-label="다음 카드">'+svgR+'</button></div>' +
    '<div class="dots">' + slides.map(function(_, k){ return '<button type="button" class="dot" aria-label="'+(k+1)+'번 카드로" data-go="'+k+'"></button>'; }).join('') + '</div>';

  var track = document.querySelector('.track'), els = track.children, idx = -1;
  var chips = document.querySelectorAll('.chipnav'), dots = document.querySelectorAll('.dot');
  var prev = document.querySelector('.prev'), next = document.querySelector('.next'), count = document.querySelector('.count');
  function go(k){ k = Math.max(0, Math.min(N - 1, k)); track.scrollTo({left: k * track.clientWidth, behavior: 'smooth'}); }
  function sync(){
    var k = Math.round(track.scrollLeft / track.clientWidth);
    if (k === idx) return; idx = k;
    for (var j = 0; j < N; j++) { els[j].classList.toggle('on', j === k); dots[j].classList.toggle('on', j === k); }
    var cur = 0; sections.forEach(function(s, n){ if (s.start <= k) cur = n; });
    chips.forEach(function(c, n){ c.classList.toggle('on', n === cur); });
    prev.disabled = k === 0; next.disabled = k === N - 1;
    count.textContent = (k + 1) + ' / ' + N;
  }
  track.addEventListener('scroll', sync, {passive: true});
  document.querySelectorAll('[data-go]').forEach(function(b){ b.addEventListener('click', function(){ go(+b.dataset.go); }); });
  prev.onclick = function(){ go(idx - 1); }; next.onclick = function(){ go(idx + 1); };
  document.querySelector('.stage').addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight') { e.preventDefault(); go(idx + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); go(idx - 1); }
  });
  // 마우스 드래그(터치는 네이티브 스크롤)
  var drag = null;
  track.addEventListener('pointerdown', function(e){ if (e.pointerType !== 'mouse') return; drag = {x: e.clientX, left: track.scrollLeft}; track.style.scrollSnapType = 'none'; });
  track.addEventListener('pointermove', function(e){ if (drag) track.scrollLeft = drag.left - (e.clientX - drag.x); });
  function end(e){ if (!drag) return; var dx = e.clientX - drag.x, base = Math.round(drag.left / track.clientWidth); drag = null; track.style.scrollSnapType = ''; go(Math.abs(dx) > track.clientWidth * .15 ? base + (dx < 0 ? 1 : -1) : base); }
  track.addEventListener('pointerup', end); track.addEventListener('pointerleave', end);
  // 임베드 시 부모에 높이 알림(모바일 자연 높이 유지)
  var post = function(){ if (window.parent !== window) window.parent.postMessage({type: 'tkleen-cards-height', h: document.documentElement.scrollHeight}, '*'); };
  new ResizeObserver(post).observe(document.body);
  requestAnimationFrame(function(){ sync(); post(); });
  window.__cards = {count: function(){ return N; }, go: go, overflow: function(){
    var bad = []; for (var j = 0; j < N; j++) { var s = els[j].firstElementChild; if (s.scrollHeight > els[j].clientHeight + 1) bad.push({slide: j, over: s.scrollHeight - els[j].clientHeight}); } return bad; }};
})();
</script>
</body>
</html>
